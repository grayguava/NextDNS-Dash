<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>NextDNS-Dash &mdash; Locked</title>
<link rel="stylesheet" href="app.css">
<script src="lock.js" defer></script>
</head>
<body class="lock-body">
<main class="lock">
    <img class="lock-logo" src="logo.svg" alt="">
    <h1 class="lock-title">NextDNS-Dash is locked</h1>
    <p class="lock-text" id="lock-text" role="status">Checking Windows Hello&hellip;</p>
    <button class="btn btn-secondary" id="unlock" type="button">Unlock with Windows Hello</button>
    <button class="btn btn-danger-solid" id="reset" type="button" hidden>Reset app data and open</button>

    <div class="lock-confirm" id="confirm" hidden>
        <p class="lock-text">This deletes the saved browser profile, sign-in session and window state, and turns off the launch lock. You will start signed out.</p>
        <button class="btn btn-danger-solid" id="confirm-reset" type="button">Delete data and open</button>
        <button class="btn btn-secondary" id="cancel-reset" type="button">Cancel</button>
    </div>
</main>
</body>
</html>
