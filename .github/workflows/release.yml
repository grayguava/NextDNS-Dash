name: Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - version
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionPath = "version"
          if (-not (Test-Path -LiteralPath $versionPath)) {
            throw "version file not found"
          }
          $raw = [string](Get-Content -LiteralPath $versionPath -Raw)
          $raw = $raw.Trim()
          if ($raw -notmatch '^v?(\d+\.\d+\.\d+)$') {
            throw "version must look like 1.0.0 or v1.0.0."
          }
          $version = $Matches[1]
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check tag
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $existing = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed" }
          if ($existing) { throw "Tag $env:TAG already exists. Bump VERSION." }

      - name: Build
        shell: pwsh
        run: cmd /c build.bat

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $root = "release/nextdns-dash"
          $dll = "$root/DLLs"
          $ui = "$root/UI"
          New-Item -ItemType Directory -Force -Path $dll, $ui | Out-Null

          if (-not (Test-Path -LiteralPath "bin/NextDNS-Dash.exe")) {
            throw "Missing bin/NextDNS-Dash.exe"
          }
          Copy-Item -LiteralPath "bin/NextDNS-Dash.exe" -Destination $root

          $dllFiles = @(
            "bin/DLLs/Microsoft.Web.WebView2.Core.dll",
            "bin/DLLs/Microsoft.Web.WebView2.WinForms.dll",
            "bin/DLLs/WebView2Loader.dll"
          )
          foreach ($file in $dllFiles) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing $file" }
            Copy-Item -LiteralPath $file -Destination $dll
          }

          $uiFiles = @(
            "index.html",
            "config.html",
            "app.css",
            "app.js",
            "logo.svg",
            "MonaSansVF.woff2",
            "OFL-MonaSans.txt"
          )
          foreach ($file in $uiFiles) {
            $source = "bin/UI/$file"
            if (-not (Test-Path -LiteralPath $source)) { throw "Missing $source" }
            Copy-Item -LiteralPath $source -Destination $ui
          }

          foreach ($doc in @("LICENSE", "NOTICE", "README.md")) {
            if (-not (Test-Path -LiteralPath $doc)) { throw "Missing $doc" }
            Copy-Item -LiteralPath $doc -Destination $root
          }
          if (-not (Test-Path -LiteralPath "docs")) { throw "Missing docs" }
          Copy-Item -LiteralPath "docs" -Destination $root -Recurse

          $zip = "release/$($env:TAG)_x64.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:TAG)_x64.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

          $check = Join-Path $env:RUNNER_TEMP "package-check"
          if (Test-Path -LiteralPath $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          $required = @(
            "NextDNS-Dash.exe",
            "DLLs/WebView2Loader.dll",
            "UI/index.html",
            "UI/config.html",
            "UI/app.css",
            "UI/app.js",
            "UI/logo.svg",
            "UI/MonaSansVF.woff2",
            "UI/OFL-MonaSans.txt",
            "LICENSE",
            "NOTICE",
            "README.md",
            "docs/usage.md",
            "docs/security.md",
            "docs/build.md"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path "$check/nextdns-dash" $file))) {
              throw "Package missing $file"
            }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextdns-dash-x64-${{ steps.version.outputs.version }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @(Get-ChildItem "release" -File | ForEach-Object { $_.FullName })
          $notes = Get-Content ".github/RELEASE_TEMPLATE.md" -Raw
          $notes = $notes.Replace("<commit>", $env:GITHUB_SHA).Replace("<tag>", $env:TAG)
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release create $env:TAG @assets `
            --draft --target $env:GITHUB_SHA --title $env:TAG `
            --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
