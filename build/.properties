# Site profile. build.bat reads this file and bakes it into the app.
#
# appName       exe file name, single-instance mutex and local host.
#               ASCII letters, digits and hyphens only.
# serviceName   user-facing name. The Home button becomes "Open <serviceName>".
# homeUrl       https page the dashboard button opens.
# allowedHosts  comma-separated hosts kept inside the app. Each entry also
#               allows its subdomains. Everything else opens in the browser.

appName=NextDNS-Dash
serviceName=NextDNS Dashboard
homeUrl=https://my.nextdns.io
allowedHosts=nextdns.io

# Optional. serviceAfnName is the company named in the Settings disclaimer;
# serviceAfnUrl makes that name a link. projectUrl adds the source link.
serviceAfnName=NextDNS
serviceAfnUrl=https://nextdns.io
projectUrl=https://github.com/grayguava/NextDNS-Dash

logo=assets\icon.svg
icon=assets\icon.ico
